; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32s3box
framework = arduino
# EN LINUX
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
# EN WINDOWS
#upload_port = COM6
#monitor_port = COM6
monitor_speed = 115200
extra_scripts = pre:load_env.py
build_flags =
	-D BOARD_HAS_PSRAM
	; --- Camera pins ---
	-D CAMERA_PIN_PWDN=-1
	-D CAMERA_PIN_RESET=-1
	-D CAMERA_PIN_XCLK=15
	-D CAMERA_PIN_SIOD=4
	-D CAMERA_PIN_SIOC=5
	-D CAMERA_PIN_D0=11
	-D CAMERA_PIN_D1=9
	-D CAMERA_PIN_D2=8
	-D CAMERA_PIN_D3=10
	-D CAMERA_PIN_D4=12
	-D CAMERA_PIN_D5=18
	-D CAMERA_PIN_D6=17
	-D CAMERA_PIN_D7=16
	-D CAMERA_PIN_VSYNC=6
	-D CAMERA_PIN_HREF=7
	-D CAMERA_PIN_PCLK=13
	; --- PubSubClient buffer size for JSON payloads ---
	; WiFi, MQTT broker, port and topics are loaded from .env via load_env.py
	-D MQTT_MAX_PACKET_SIZE=2048
lib_deps =
	espressif/esp32-camera
	knolleary/PubSubClient@^2.8
